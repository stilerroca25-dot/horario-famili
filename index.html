<!DOCTYPE html>

<head>

    <style>
        /* ========================= */
/* CONFIGURACIÓN GENERAL */
/* ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#E8E8E8;
}

/* ========================= */
/* PANTALLAS */
/* ========================= */

#login,
#registro,
#organizador{

    width:100%;
    min-height:100vh;

}

#registro{

    display:none;

}

#organizador{

    display:none;

}

/* ========================= */
/* CONTENEDOR */
/* ========================= */

.contenedor{

    width:400px;
    background:white;
    margin:80px auto;
    padding:35px;
    border-radius:15px;
    box-shadow:0px 0px 20px rgba(0,0,0,0.25);

}

/* ========================= */
/* TITULOS */
/* ========================= */

h1{

    text-align:center;
    margin-bottom:20px;
    font-size:40px;

}

h2{

    text-align:center;
    margin-bottom:25px;

}

/* ========================= */
/* INPUTS */
/* ========================= */

input{

    width:100%;
    padding:13px;
    margin-top:15px;
    border:1px solid #999;
    border-radius:8px;
    font-size:16px;
    outline:none;

}

input:focus{

    border:2px solid #4CAF50;

}

/* ========================= */
/* CONTRASEÑA */
/* ========================= */

.password{

    display:flex;
    gap:10px;
    margin-top:15px;

}

.password input{

    flex:1;
    margin-top:0;

}

/* ========================= */
/* BOTONES */
/* ========================= */

button{

    cursor:pointer;
    border:none;
    border-radius:8px;
    transition:0.3s;

}

#btnIngresar,
#btnCrearCuenta{

    width:100%;
    padding:13px;
    background:#4CAF50;
    color:white;
    font-size:17px;
    margin-top:20px;

}

#btnIngresar:hover,
#btnCrearCuenta:hover{

    background:#2f8f35;

}

/* ========================= */
/* BOTÓN OJO */
/* ========================= */

#verLogin,
#verRegistro{

    width:55px;
    background:#555;
    color:white;
    font-size:18px;

}

#verLogin:hover,
#verRegistro:hover{

    background:#333;

}

/* ========================= */
/* BOTÓN ATRÁS */
/* ========================= */

#volver{

    width:110px;
    padding:10px;
    background:#777;
    color:white;
    margin-bottom:20px;

}

#volver:hover{

    background:#555;

}

/* ========================= */
/* CREAR CUENTA */
/* ========================= */

p{

    text-align:center;
    margin-top:25px;
    font-size:16px;

}

a{

    text-decoration:none;
    color:blue;
    font-weight:bold;

}

a:hover{

    text-decoration:underline;

}

/* ========================= */
/* BOTÓN CERRAR SESIÓN */
/* ========================= */

#cerrarSesion{

    width:180px;
    padding:12px;
    background:#d9534f;
    color:white;
    display:block;
    margin:20px auto;

}

#cerrarSesion:hover{

    background:#b52b27;

}

/* ========================= */
/* ENCABEZADO DEL HORARIO */
/* ========================= */

.encabezadoHorario{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:25px;

    margin-top:20px;

    margin-bottom:10px;

}


.encabezadoHorario h1{

    margin:0;

}


#btnAlarma,
#btnTareas{

    padding:12px 20px;

    background:#4CAF50;

    color:white;

    font-size:16px;

    border:none;

    border-radius:8px;

}


#btnAlarma:hover,
#btnTareas:hover{

    background:#2f8f35;

}

/* ========================= */
/* TABLA */
/* ========================= */

table{

    width:90%;
    margin:30px auto;
    border-collapse:collapse;
    background:white;

}

th{

    background:#BFBFBF;
    padding:18px;
    border:2px solid black;
    font-size:18px;

}

td{

    border:2px solid black;
    height:70px;
    text-align:center;
    font-size:16px;

}

/* ========================= */
/* FECHA EN CADA CASILLA */
/* ========================= */

td{

    position:relative;

    padding-top:25px;

}


.fechaCasilla{

    position:absolute;

    top:4px;

    left:4px;

    width:92px;

    height:20px;

    border:1px solid #777;

    border-radius:4px;

    background:#F2F2F2;

    color:#555;

    font-size:11px;

    text-align:center;

    line-height:20px;

    cursor:pointer;

    user-select:none;

}


.fechaCasilla:hover{

    background:#DDDDDD;

}


.inputFechaCasilla{

    position:absolute;

    top:4px;

    left:4px;

    width:125px;

    height:25px;

    font-size:11px;

    z-index:10;

}

td:focus{

    background:#FFFFCC;
    outline:none;

}


/* ========================= */
/* BIENVENIDA */
/* ========================= */

#bienvenida{

    display:none;
    width:100%;
    height:100vh;

    background:#4CAF50;
    color:white;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    animation: aparecer 2s;

}


#bienvenida h1{

    font-size:70px;
    font-family:Georgia, serif;
    margin-bottom:20px;

}


#nombreBienvenida{

    font-size:85px;
    font-family:"Brush Script MT", cursive;

    animation: crecer 1.5s;

}


#fraseBienvenida{

    font-size:25px;
    margin-top:25px;

    opacity:0;

    animation: aparecerFrase 2s forwards;
    animation-delay:0.5s;

}



@keyframes aparecer{

    from{

        opacity:0;

    }

    to{

        opacity:1;

    }

}



@keyframes crecer{

    from{

        transform:scale(0.5);
        opacity:0;

    }

    to{

        transform:scale(1);
        opacity:1;

    }

}



@keyframes aparecerFrase{

    from{

        opacity:0;
        transform:translateY(20px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}

/* ========================= */
/* VENTANA DE ALARMA */
/* ========================= */

#ventanaAlarma{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:
    rgba(0,0,0,0.55);

    justify-content:center;

    align-items:center;

    z-index:1000;

}


.contenidoAlarma{

    width:380px;

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:
    0 0 25px
    rgba(0,0,0,0.35);

}


.contenidoAlarma h2{

    margin-bottom:20px;

}


.contenidoAlarma select{

    width:100%;

    padding:13px;

    margin-top:15px;

    border:1px solid #999;

    border-radius:8px;

    font-size:16px;

}


.botonesAlarma{

    display:flex;

    justify-content:space-between;

    gap:15px;

    margin-top:25px;

}


#cancelarAlarma,
#guardarAlarma{

    width:50%;

    padding:13px;

    color:white;

    font-size:16px;

}


#cancelarAlarma{

    background:#777;

}


#guardarAlarma{

    background:#4CAF50;

}

/* ========================= */
/* VENTANA DE TAREAS */
/* ========================= */

#ventanaTareas{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:
    rgba(0,0,0,0.55);

    justify-content:center;

    align-items:center;

    z-index:1000;

}


.contenidoTareas{

    width:450px;

    max-height:85vh;

    overflow-y:auto;

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:
    0 0 25px
    rgba(0,0,0,0.35);

}


.contenidoTareas h2{

    margin-bottom:20px;

}


.tarjetaTarea{

    background:#F2F2F2;

    border-left:
    6px solid #4CAF50;

    padding:18px;

    margin-bottom:15px;

    border-radius:8px;

}


.tarjetaTarea h3{

    margin-bottom:10px;

}


.tarjetaTarea p{

    text-align:left;

    margin-top:7px;

    font-size:15px;

}

/* ========================= */
/* BOTONES DE CADA TAREA */
/* ========================= */

.botonesTarea{

    display:flex;

    gap:8px;

    margin-top:15px;

}


.botonesTarea button{

    flex:1;

    padding:10px;

    border:none;

    border-radius:7px;

    color:white;

    cursor:pointer;

}


.btnCompletar{

    background:#4CAF50;

}


.btnEditar{

    background:#2196F3;

}


.btnEliminar{

    background:#E53935;

}

#cerrarTareas{

    width:100%;

    padding:13px;

    margin-top:15px;

    background:#777;

    color:white;

    font-size:16px;

}

/* ================================= */
/* DISEÑO RESPONSIVE GENERAL */
/* ================================= */

*{

    box-sizing:border-box;

}


html,

body{

    width:100%;

    max-width:100%;

    margin:0;

    overflow-x:hidden;

}


/* ================================= */
/* ORGANIZADOR */
/* ================================= */

#organizador{

    width:100%;

    max-width:1400px;

    margin:auto;

    padding:15px;

}


/* ================================= */
/* ENCABEZADO */
/* ================================= */

.encabezadoHorario{

    width:100%;

    display:flex;

    flex-wrap:wrap;

    align-items:center;

    justify-content:center;

    gap:15px;

}


.encabezadoHorario h1{

    margin:0;

    text-align:center;

    font-size:clamp(
        32px,
        5vw,
        65px
    );

}


#btnAlarma,

#btnTareas,

#btnNotificaciones{

    max-width:100%;

    padding:12px 18px;

    font-size:clamp(
        13px,
        2vw,
        16px
    );

}


/* ================================= */
/* CONTENEDOR DEL HORARIO */
/* ================================= */

#organizador{

    overflow-x:auto;

    -webkit-overflow-scrolling:touch;

}


/* ================================= */
/* TABLA */
/* ================================= */

#organizador table{

    width:100%;

    min-width:850px;

    margin:25px auto;

    border-collapse:collapse;

    table-layout:fixed;

}


#organizador th{

    padding:15px 8px;

    font-size:clamp(
        14px,
        2vw,
        20px
    );

    white-space:normal;

}


#organizador td{

    height:85px;

    min-width:115px;

    padding-top:30px;

    font-size:clamp(
        12px,
        1.8vw,
        16px
    );

    overflow-wrap:anywhere;

}


/* ================================= */
/* FECHA */
/* ================================= */

#organizador .fechaCasilla{

    top:4px;

    left:4px;

    width:90px;

    max-width:
    calc(
        100% - 8px
    );

    height:20px;

    font-size:10px;

    line-height:20px;

    overflow:hidden;

    white-space:nowrap;

}


#organizador .inputFechaCasilla{

    top:3px;

    left:3px;

    width:
    calc(
        100% - 6px
    );

    max-width:125px;

    height:23px;

    font-size:10px;

}


/* ================================= */
/* VENTANAS */
/* ================================= */

.contenidoAlarma,

.contenidoTareas{

    width:90%;

    max-width:450px;

    max-height:85vh;

    overflow-y:auto;

}


/* ================================= */
/* CELULARES */
/* ================================= */

@media screen and (max-width:600px){

    #organizador{

        padding:8px;

    }


    .encabezadoHorario{

        gap:8px;

    }


    .encabezadoHorario h1{

        width:100%;

        font-size:42px;

    }


    #btnAlarma,

    #btnTareas,

    #btnNotificaciones{

        flex:1;

        min-width:100px;

        padding:10px 8px;

        font-size:13px;

    }


    #cerrarSesion{

        width:80%;

        max-width:300px;

    }


    /* La tabla conserva casillas cómodas
       y se desliza solo dentro del horario */

    #organizador table{

        min-width:840px;

        margin:15px 0;

    }


    #organizador th{

        padding:12px 5px;

        font-size:15px;

    }


    #organizador td{

        height:80px;

        font-size:13px;

    }


    .contenidoAlarma,

    .contenidoTareas{

        width:94%;

        padding:18px;

    }

}

// =======================================
// CREAR FECHA EN CADA CASILLA
// =======================================

function crearFechaCasilla(celda){

    // Revisar si la fecha ya existe

    if(

        celda.querySelector(
            ".fechaCasilla"
        )

    ){

        return;

    }


    // Crear rectángulo de fecha

    const fecha =

    document.createElement(
        "div"
    );


    fecha.className =

    "fechaCasilla";


    fecha.textContent =

    "dd/mm/aaaa";


    fecha.contentEditable =

    "false";


    // Agregar fecha a la esquina

    celda.prepend(
        fecha
    );


    // Al hacer clic

    fecha.addEventListener(

        "click",

        function(event){

            event.stopPropagation();


            const inputFecha =

            document.createElement(
                "input"
            );


            inputFecha.type =

            "date";


            inputFecha.className =

            "inputFechaCasilla";


            inputFecha.contentEditable =

            "false";


            // Ocultar rectángulo

            fecha.style.display =

            "none";


            // Agregar selector

            celda.appendChild(
                inputFecha
            );


            inputFecha.focus();


            inputFecha.showPicker?.();


            // Guardar fecha elegida

            inputFecha.addEventListener(

                "change",

                function(){

                    if(

                        inputFecha.value
                        !==
                        ""

                    ){

                        const partes =

                        inputFecha.value
                        .split("-");


                        fecha.textContent =

                        partes[2]

                        +

                        "/"

                        +

                        partes[1]

                        +

                        "/"

                        +

                        partes[0];

                    }


                    inputFecha.remove();


                    fecha.style.display =

                    "block";


                    guardarHorario();

                }

            );


            // Si no elige fecha

            inputFecha.addEventListener(

                "blur",

                function(){

                    setTimeout(

                        function(){

                            if(

                                inputFecha.parentNode

                            ){

                                inputFecha.remove();


                                fecha
                                .style
                                .display =

                                "block";

                            }

                        },

                        200

                    );

                }

            );

        }

    );

}

async function actualizarAlarma(

    alarmaVieja,

    alarmaNueva

){


    const usuario =

    auth.currentUser;


    if(!usuario){

        return;

    }


    const referencia =

    doc(

        db,

        "alarmas",

        usuario.uid

    );


    const documento =

    await getDoc(

        referencia

    );


    if(

        !documento.exists()

    ){

        return;

    }


    const datos =

    documento.data();


    const alarmas =

    datos.listaAlarmas

    ||

    [];


    const nuevasAlarmas =

    alarmas.map(

        function(alarma){


            if(

                alarma.tarea

                ===

                alarmaVieja.tarea


                &&


                alarma.dia

                ===

                alarmaVieja.dia


                &&


                alarma.hora

                ===

                alarmaVieja.hora

            ){


                return{

                    ...alarmaNueva,

                    completada:

                    alarma.completada

                };


            }


            return alarma;


        }

    );


    await setDoc(

        referencia,

        {

            listaAlarmas:

            nuevasAlarmas

        },

        {

            merge:true

        }

    );


}

        !==

        await getDoc(

                db,

                "alarmas",

                usuario.uid

            )

        );


        if(

            !documento.exists()

        ){

            return;

        }


        const datos =

        documento.data();


        const alarmas =

        datos.listaAlarmas

        ||

        [];


        const ahora =

        new Date();


        const dias = [

            "Domingo",

            "Lunes",

            "Martes",

            "Miércoles",

            "Jueves",

            "Viernes",

            "Sábado"

        ];


        const diaActual =

        dias[
            ahora.getDay()
        ];


        const horaActual =

        String(

            ahora.getHours()

                String(

                    fechaAlarma
                    .getHours()

                ).padStart(

                    2,

                    "0"

                );


                const minutoAviso =

                String(

                    fechaAlarma
                    .getMinutes()

                ).padStart(

                    2,

                    "0"

                );


                const tiempoAviso =

                horaAviso

                +

                ":"

                +

                minutoAviso;


                const identificador =

                alarma.tarea

                +

                "-"

                +

                alarma.dia

                +

                "-"

                +

                alarma.hora

                +

                "-"

                +

                tiempoAviso;


                if(

                    tiempoActual
                    ===
                    tiempoAviso

                    &&

                    !alarmasNotificadas
                    .has(

                        identificador

                    )

                ){


                    new Notification(

                        "🔔 Organizador Familiar",

                        {

                            body:

                            "Tienes que: "

                            +

                            alarma.tarea

                        }

                    );


                    alarmasNotificadas
                    .add(

                        identificador

                    );

                }

            }

        );


    }catch(error){


        console.error(

            "Error al revisar alarmas:",

            error

        );

    }

}

// =======================================
// INICIAR REVISIÓN DE ALARMAS
// =======================================

setInterval(

    revisarAlarmas,

    30000

);

// =======================================
// CAMBIAR ESTADO DE UNA TAREA
// =======================================

async function cambiarEstadoTarea(

    alarmaSeleccionada

){


    const usuario =

    auth.currentUser;


    if(!usuario){

        return;

    }


    const referencia =

    doc(

        db,

        "alarmas",

        usuario.uid

    );


    const documento =

    await getDoc(

        referencia

    );


    if(

        !documento.exists()

    ){

        return;

    }


    const datos =

    documento.data();


    const alarmas =

    datos.listaAlarmas

    ||

    [];


    const nuevasAlarmas =

    alarmas.map(

        function(alarma){


            if(

                alarma.tarea
                ===
                alarmaSeleccionada.tarea

                &&

                alarma.dia
                ===
                alarmaSeleccionada.dia

                &&

                alarma.hora
                ===
                alarmaSeleccionada.hora

            ){


                return{

                    ...alarma,

                    completada:

                    !alarma.completada

                };

            }


            return alarma;

        }

    );


    await setDoc(

        referencia,

        {

            listaAlarmas:

            nuevasAlarmas

        },

        {

            merge:true

        }

    );

}

// =======================================
// ELIMINAR UNA TAREA
// =======================================

async function eliminarTarea(

    alarmaSeleccionada

){


    const usuario =

    auth.currentUser;


    if(!usuario){

        return;

    }


    const referencia =

    doc(

        db,

        "alarmas",

        usuario.uid

    );


    const documento =

    await getDoc(

        referencia

    );


    if(

        !documento.exists()

    ){

        return;

    }


    const datos =

    documento.data();


    const alarmas =

    datos.listaAlarmas

    ||

    [];


    const nuevasAlarmas =

    alarmas.filter(

        function(alarma){


            return !(

                alarma.tarea

                ===

                alarmaSeleccionada.tarea


                &&


                alarma.dia

                ===

                alarmaSeleccionada.dia


                &&


                alarma.hora

                ===

                alarmaSeleccionada.hora

            );


        }

    );


    await setDoc(

        referencia,

        {

            listaAlarmas:

            nuevasAlarmas

        },

        {

            merge:true

        }

    );


}
